<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Access — stxbandz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0F11;
    --surface:#16181B;
    --text:#E7E5DF;
    --text-dim:#86888E;
    --accent:#5cd67d;
    --accent-soft:#bbf2cc;
    --hairline:#26282C;
    --hairline-mid:rgba(124,138,110,0.32);
    --font-sans:'Inter',sans-serif;
    --font-display:'Schibsted Grotesk',sans-serif;
    --font-mono:'Geist Mono',monospace;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;
    background:radial-gradient(120% 80% at 50% -10%,rgba(124,138,110,0.06),transparent 60%),var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .login-wrap{
    width:100%;
    max-width:380px;
    padding:24px;
  }
  .login-card{
    background:var(--surface);
    border:1px solid var(--hairline-mid);
    border-radius:14px;
    padding:32px 28px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(124,138,110,0.18);
  }
  .login-brand{
    font-family:var(--font-mono);
    letter-spacing:0.22em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--accent);
    margin-bottom:6px;
  }
  .login-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .login-subtitle{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 24px;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--hairline-mid);
    background:rgba(2,8,4,0.5);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:12px;
    outline:none;
    transition:border-color 0.45s var(--ease),box-shadow 0.45s var(--ease),transform 0.45s var(--ease);
  }
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(124,138,110,0.2), 0 8px 24px rgba(0,0,0,0.35);
    transform:translateY(-1px);
  }
  .login-btn{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--accent);
    background:rgba(124,138,110,0.18);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background 0.35s var(--ease),border-color 0.35s var(--ease),transform 0.2s var(--ease);
    margin-top:4px;
  }
  .login-btn:hover{
    background:rgba(124,138,110,0.34);
    border-color:#a2f7ef;
    transform:translateY(-1px);
  }
  .login-btn:focus-visible{
    outline:1px solid var(--accent-soft);
    outline-offset:3px;
  }
  .login-btn:active{
    transform:translateY(0);
  }
  .login-error{
    margin-top:12px;
    font-family:var(--font-mono);
    font-size:11px;
    color:#B07A72;
    min-height:16px;
    transition:opacity 0.3s var(--ease);
  }
  .login-footer{
    margin-top:18px;
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
  }
  .login-footer a{
    color:var(--text-dim);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s var(--ease), color 0.2s var(--ease);
  }
  .login-footer a:hover,
  .login-footer a:focus-visible{
    color:var(--accent-soft);
    border-color:var(--accent-soft);
    outline:none;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
  }
  .shake {
    animation: shake 0.4s var(--ease);
  }
  @media (max-width: 520px){
    .login-wrap{padding:16px}
    .login-card{padding:24px 18px;border-radius:12px}
    .login-title{font-size:20px}
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">Terra Obscura</div>
      <h1 class="login-title">Telemetry Console Access</h1>
      <p class="login-subtitle">Provide the key to enter the secured Terra Obscura analytics channel.</p>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="pw">Access Key</label>
          <input type="password" id="pw" placeholder="••••••" spellcheck="false" />
        </div>
        <button type="submit" class="login-btn">Unlock Dashboard</button>
      </form>

      <div class="login-error" id="err" aria-live="polite"></div>

      <div class="login-footer">
        <a href="index.html">&larr; Back to index</a>
      </div>
    </div>
  </div>

<script>
  const AUTH_KEY = "stx_dash_auth";
  const PW = "test321";
  const form = document.getElementById("loginForm");
  const input = document.getElementById("pw");
  const err = document.getElementById("err");

  if (sessionStorage.getItem(AUTH_KEY) === "1") {
    window.location.replace("dashboard-view.html");
  }

  function showError(msg) {
    err.textContent = msg;
    err.style.opacity = "1";
    setTimeout(() => { err.style.opacity = "0"; }, 2200);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const v = input.value;
    if (v === PW) {
      err.textContent = "";
      sessionStorage.setItem(AUTH_KEY, "1");
      window.location.href = "dashboard-view.html";
    } else {
      showError("Incorrect access key.");
      input.value = "";
      input.focus();

      const card = document.querySelector(".login-card");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
    }
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") form.requestSubmit();
  });
</script>
</body>
</html>
